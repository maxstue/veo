name: Quality and deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: 24
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install

      - name: Check formatting, linting, and types together
        run: vp check

      - name: Run unit tests with coverage
        run: vp run test:coverage

      - name: Upload Vitest coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vitest-coverage-report
          path: coverage/unit
          if-no-files-found: warn
          retention-days: 14

      - name: Build application
        run: vp build

      - name: Install Playwright browser
        run: vp exec playwright install --with-deps chromium

      - name: Run end-to-end tests with coverage
        run: vp run test:e2e

      - name: Generate Playwright coverage report
        if: always()
        run: vp run test:e2e:coverage-report

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-reports
          path: |
            playwright-report
            coverage/e2e
          if-no-files-found: warn
          retention-days: 14

      - name: Publish SonarQube Cloud analysis
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        with:
          args: >
            -Dsonar.projectKey=maxstue_veo
            -Dsonar.organization=maxstue
            -Dsonar.sources=src
            -Dsonar.tests=src,e2e
            -Dsonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,e2e/**/*.spec.ts
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    name: Deploy production
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://veo.justmax.xyz
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: 24
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install

      - name: Apply production database migrations
        run: vp run db:migrate:remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker
        run: vp run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
